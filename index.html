<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #ededed;
            --text-secondary: #888888;
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Top Navigation */
        header {
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeInDown 1s ease forwards;
            opacity: 0;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Main Hero Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 4rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-content {
            max-width: 800px;
            animation: fadeInUp 1s ease 0.3s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        h1 {
            font-size: clamp(3rem, 5vw, 5.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
        }

        p.subtitle {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-weight: 400;
            max-width: 650px;
        }

        /* Button Design */
        .contact-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: var(--accent);
            color: var(--bg-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 4px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        /* Footer */
        footer {
            padding: 2rem 4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            animation: fadeIn 1s ease 0.6s forwards;
            opacity: 0;
        }

        /* Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            header, main, footer {
                padding-left: 2rem;
                padding-right: 2rem;
            }
            
            h1 {
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Developer.</div>
        <nav class="nav-links">
            <a href="mailto:catscaicai@gmail.com">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero-content">
            <h1>Crafting elegant<br>digital experiences.</h1>
            <p class="subtitle">I'm a software developer focused on transforming complex problems into simple, beautiful, and efficient architectures.</p>
            <a href="mailto:catscaicai@gmail.com" class="contact-btn">Get in touch: catscaicai@gmail.com</a>
        </div>
    </main>

    <footer>
        <div class="copyright">© 2026 All rights reserved.</div>
        <div class="location">Global</div>
    </footer>

</body>
</html>
